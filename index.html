<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />
    <title>TryBuy</title>
    <!-- THEME-03: set the theme before first paint, or a light-mode visitor sees a dark flash.
         Same rule as resolveTheme() in src/lib/theme/theme.ts (theme.test.ts runs both). -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('tb-theme');
        } catch (e) {}
        var prefersLight =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved === 'light' || saved === 'dark' ? saved : prefersLight ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#FAFAFA' : '#09090B');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Image CDN. Every <img> here is a plain (non-CORS) request, so this must
         stay without `crossorigin` or the warmed connection is never reused. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
